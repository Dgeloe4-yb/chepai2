spring.application.name=chepai-bakend
server.port=${SERVER_PORT:8080}

# 数据源：请用环境变量覆盖，勿将密码写入仓库
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:chepai}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 边缘盒上报鉴权（留空则关闭）；截图存储目录
chepai.edge.token=${CHEPAI_EDGE_TOKEN:}
chepai.snapshots.dir=${CHEPAI_SNAPSHOTS_DIR:./data/snapshots}
chepai.retention.alert-days=${CHEPAI_RETENTION_ALERT_DAYS:30}
chepai.retention.snapshot-days=${CHEPAI_RETENTION_SNAPSHOT_DAYS:30}
chepai.retention.cron=${CHEPAI_RETENTION_CRON:0 30 3 * * *}
chepai.retention.log-days=${CHEPAI_RETENTION_LOG_DAYS:7}
chepai.edge.online-seconds=${CHEPAI_EDGE_ONLINE_SECONDS:90}
chepai.edge.log-max-chars=${CHEPAI_EDGE_LOG_MAX_CHARS:200000}
chepai.edge.log-keep=${CHEPAI_EDGE_LOG_KEEP:40}
chepai.voice.dir=${CHEPAI_VOICE_DIR:./data/voice}
chepai.admin.username=${CHEPAI_ADMIN_USERNAME:admin}
chepai.admin.password=${CHEPAI_ADMIN_PASSWORD:ChepaiAdmin@2026}
chepai.session.days=${CHEPAI_SESSION_DAYS:7}
server.error.include-message=always
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
